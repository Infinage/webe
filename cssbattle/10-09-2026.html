<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <script src="datastar.js" type="module" defer></script>
</head>
<body class="flex flex-col justify-center items-center h-screen [--size:15rem]">
  <div class="
    border-[#333333] border-[calc(0.1*var(--size))] 
    h-[calc(0.65*var(--size))] w-[calc(0.65*var(--size))] 
    translate-y-[calc(0.1*var(--size))] 
    rounded-t-full relative
  ">
    <div class="
      bg-white w-[calc(0.1*var(--size))] h-1/2 
      absolute top-1/2 -left-[calc(0.1*var(--size))]
    "></div>
  </div>
  <div class="bg-[#333333] h-[calc(0.80*var(--size))] w-[var(--size)] rounded-b-full">
</body>
</html>
