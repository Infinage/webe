<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <script src="alpine.js" defer></script>
</head>
<body class="bg-[#3E6D43] grid justify-center place-items-center h-screen">
  <div class="w-[25rem] h-[25rem] bg-[#E5CA72] relative">
    <div class="grid grid-rows-2 grid-cols-2 h-[15%] w-[15%] gap-[50%]
      absolute top-1/2 -translate-y-1/2 left-1/2 -translate-x-1/2"
    >
      <div class="bg-[#3E6D43]"></div>
      <div class="bg-[#3E6D43]"></div>
      <div class="bg-[#3E6D43]"></div>
      <div class="bg-[#3E6D43]"></div>
    </div>

    <div class="bg-[#E5CA72] h-1/3 w-[15%] border-[#3E6D43] border-x-[12px]
      absolute -top-[5%] left-1/2 -translate-x-1/2"></div>

    <div class="bg-[#E5CA72] h-[15%] w-1/3 border-[#3E6D43] border-y-[12px]
      absolute -left-[5%] top-1/2 -translate-y-1/2"></div>

    <div class="bg-[#E5CA72] h-[15%] w-1/3 border-[#3E6D43] border-y-[12px]
      absolute -right-[5%] top-1/2 -translate-y-1/2"></div>

    <div class="bg-[#E5CA72] h-1/3 w-[15%] border-[#3E6D43] border-x-[12px]
      absolute -bottom-[5%] left-1/2 -translate-x-1/2"></div>
  </div>
</body>
</html>
