<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <script src="datastar.js" type="module" defer></script>
</head>
<body class="h-screen w-full flex">
  <div class="bg-[#72374D] w-full h-full flex justify-center items-center">
    <div class="grid grid-cols-2 aspect-square h-32 translate-y-1/4">
      <div class="bg-[#FFFFFF]"></div>
      <div class="bg-[#FFFFFF] [clip-path:polygon(0_0,100%_100%,0_100%)]"></div>
      <div class="bg-[#FFFFFF] [clip-path:polygon(0_0,100%_0,100%_100%)]"></div>
    </div>
  </div>
</body>
</html>
