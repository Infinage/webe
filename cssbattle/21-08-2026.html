<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <script src="alpine.js" defer></script>
</head>
<body class="bg-[#3157B4] grid justify-center place-items-center h-screen">
  <div class="h-[10rem] w-[25rem] relative">
    <div class="h-[10rem] w-[10rem] bg-[#84BE8D] rounded-tr-[100%] absolute 
      left-0 top-0 -translate-y-[100%] -translate-x-[100%]"></div>

    <div class="h-[10rem] w-[10rem] bg-[#84BE8D] rounded-tl-[100%] absolute
      right-0 top-0 -translate-y-[100%] translate-x-[100%]"></div>

    <div class="bg-[#84BE8D] h-full w-full absolute left-1/2 
      top-1/2 -translate-x-1/2 -translate-y-1/2"></div>

    <div class="h-[10rem] w-[10rem] bg-[#84BE8D] rounded-br-[100%] absolute 
      left-0 bottom-0 translate-y-[100%] -translate-x-[100%]"></div>

    <div class="h-[10rem] w-[10rem] bg-[#84BE8D] rounded-bl-[100%] absolute
      right-0 bottom-0 translate-y-[100%] translate-x-[100%]"></div>
  </div>
</body>
</html>
