<div class="container">
  <div class="vertical"></div>
  <div class="horizontal"></div>
  <div class="diagnol-45"></div>
  <div class="diagnol-135"></div>
  <div class="octagon"></div>
</div>
<style>
:root {
  --oct-size: 40px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  height: 100%;
}

body {
  height: 100%;
  background-color: #0D1335;
  display: flex;
  justify-content: center;
  place-items: center;
  position: relative;
}

.container {
  height: 140px;
  aspect-ratio: 1/1;
  position: absolute;
  display: flex;
  justify-content: center;
  align-items: center;

  > div {
    position: absolute;
    width: 100%;
    height: 20px;
    background-color: #FBFAE2;

    &.vertical {
      rotate: 90deg;
    }

    &.diagnol-45 {
      rotate: 45deg;
    }

    &.diagnol-135 {
      rotate: 135deg;
    }
  }

  .octagon {
      width: var(--oct-size);
      height: var(--oct-size);
      background: #0D1335;
      position: relative;
      text-align: center;
  }

  .octagon:before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;    
      border-bottom: calc(var(--oct-size) * 0.29) solid #0D1335;
      border-left: calc(var(--oct-size) * 0.29) solid #fff;
      border-right: calc(var(--oct-size) * 0.30) solid #fff;
      width: calc(var(--oct-size) * 0.42);
      height: 0;
  }

  .octagon:after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;    
      border-top: calc(var(--oct-size) * 0.29) solid #0D1335;
      border-left: calc(var(--oct-size) * 0.29) solid #fff;
      border-right: calc(var(--oct-size) * 0.30) solid #fff;
      width: calc(var(--oct-size) * 0.42);
      height: 0;
  }  
}
</style>
