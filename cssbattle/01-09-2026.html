<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <script src="datastar.js" type="module" defer></script>
</head>
<body class="bg-[#BADE37] h-screen items-center justify-center grid [--gap:2rem]">
  <div class="w-[20rem] h-[20rem] relative">
    <div class="border-[#333333] border-[3rem] rounded-full h-full w-full absolute"></div>
    <div class="absolute bg-[#bade37] h-full w-[var(--gap)] left-1/2 -translate-x-1/2"></div>
    <div class="absolute bg-[#bade37] h-[8rem] w-1/2 top-1/2 -translate-y-1/2"></div>
    <div class="absolute h-[8rem] w-1/2 right-0 top-1/2 -translate-y-1/2 
      flex flex-col justify-between"
    >
      <div class="bg-[#bade37] h-[var(--gap)] w-full"></div>
      <div class="bg-[#bade37] h-[var(--gap)] w-full"></div>
    </div>
  </div>
</body>
</html>
