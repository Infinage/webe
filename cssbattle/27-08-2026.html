  <script src="alpine.js" defer></script>

<body class="bg-[#4E53BB] h-screen w-screen flex flex-col gap-8 justify-end place-items-center">
  <div class="bg-[#DBDDFF] sm:h-1/3 lg:h-1/2 md:w-1/3 sm:w-1/2 grid">
    <div class="bg-[#4D4A18] w-1/5 h-1/2 rounded-t-full justify-self-center place-self-end">
    </div>
  </div>
  <div class="bg-[#DBDDFF] h-1/3 w-full 
    md:[clip-path:polygon(33%_0%,67%_0%,100%_100%,0%_100%)]

    "></div>
