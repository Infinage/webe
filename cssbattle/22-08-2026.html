<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <script src="alpine.js" defer></script>
</head>
<body class="bg-[#94B31F] h-screen grid justify-center place-items-center">
  <div class="
    h-[16rem] w-[24rem] grid gap-2
    grid-cols-[3fr_1fr_3fr_1fr_3fr] 
    grid-rows-[1fr_4fr_1fr]
  ">
    <div class="bg-[#5F5F1E]"></div>
    <div class="bg-white rounded-full aspect-square self-center"></div>
    <div class="bg-[#5F5F1E] row-span-full"></div>
    <div class="bg-white rounded-full aspect-square self-center"></div>
    <div class="bg-[#5F5F1E]"></div>

    <div class="row-start-2 col-start-1 col-span-2"></div>
    <div class="row-start-2 col-start-4 col-span-2"></div>

    <div class="bg-[#5F5F1E]"></div>
    <div class="bg-white rounded-full aspect-square self-center"></div>
    <div class="bg-white rounded-full col-start-4 aspect-square self-center"></div>
    <div class="bg-[#5F5F1E]"></div>
  </div>
</body>
</html>
