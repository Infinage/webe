<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <script src="alpine.js" defer></script>
</head>
<body class="h-screen flex">
<div class="bg-[#479582] h-full w-full flex justify-center items-center">
	<div class="border-x-[20px] border-[#2834BA] h-52 w-48 relative rounded-2xl">
		<div class="w-16 aspect-[3/2] rounded-t-full bg-[#2834BA] absolute -translate-x-[calc(50%+10px)] left-0 bottom-0 flex items-end justify-center gap-5">
			<div class="h-5 w-3 bg-[#2834BA] translate-y-full"></div>
			<div class="h-5 w-3 bg-[#2834BA] translate-y-full"></div>
		</div>
		
		<div class="w-16 aspect-[3/2] rounded-b-full bg-[#2834BA] absolute translate-x-[calc(50%+10px)] right-0 top-0 flex items-start justify-center gap-5">
			<div class="h-5 w-3 bg-[#2834BA] -translate-y-full"></div>
			<div class="h-5 w-3 bg-[#2834BA] -translate-y-full"></div>
		</div>
		
		<div class="bg-[#2834BA] w-5 h-full mx-auto relative rounded-t-full rounded-b-full">
			<div class="absolute border-[#2834BA] border-[20px] aspect-square w-[6.5rem] top-0 rounded-full right-0 -translate-y-[35px]"></div>
			<div class="absolute border-[#2834BA] border-[20px] aspect-square w-[6.5rem] bottom-0 rounded-full left-0 translate-y-[35px]"></div>
		</div>
	</div>
</div>
</body>
</html>
