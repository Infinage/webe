<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <script src="datastar.js" type="module" defer></script>
</head>
<body class="bg-[#7253BC] h-screen flex items-center justify-center [--shift:3rem]">
  <div class="h-3/4 w-1/6 min-w-[20rem] relative">
    <div class="h-full w-8 bg-[#391B1B]"></div>
    <div class="absolute w-full h-1/3 top-[2rem]">
      <div class="bg-white border-[#391B1B] border-[2rem] h-full w-1/2 absolute top-0"></div>
      <div class="bg-white border-[#391B1B] border-r-[2rem] border-y-[2rem] h-full 
        w-1/2 absolute top-0 left-1/2 translate-y-[var(--shift)] -translate-x-[2rem]">
        <div class="bg-[#391B1B] h-[var(--shift)] w-[2rem] absolute bottom-0"></div>
      </div>
    </div>
  </div>
</body>
</html>
