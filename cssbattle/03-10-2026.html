<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <script src="datastar.js" type="module" defer></script>
</head>
<body class="bg-[#B08743] h-screen flex justify-center items-center">
  <div class="h-[25rem] aspect-square bg-[#441212] rounded-full flex 
    justify-center items-center overflow-hidden"
  >
    <div class="bg-[white] h-[20rem] aspect-square rounded-full relative">
      <div class="absolute bg-[#441212] h-[20rem] aspect-square rounded-full 
        -translate-y-[60%] -translate-x-[30%]"></div>
      <div class="absolute bg-[#441212] h-[20rem] aspect-square rounded-full 
        -translate-y-[50%] translate-x-[70%]"></div>
      <div class="absolute flex left-1/2 -translate-x-1/2 top-1/2 justify-between 
        w-full px-12"
      >
        <div class="w-8 aspect-square rounded-full bg-[#441212]"></div>
        <div class="w-8 aspect-square rounded-full bg-[#441212]"></div>
      </div>
    </div>
  </div>
</body>
</html>
