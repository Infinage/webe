<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <script src="datastar.js" type="module" defer></script>
</head>
<body class="bg-[#FFD0BD] flex items-center justify-center h-screen">
  <div class="relative h-[24rem] w-[12rem] border-[2rem] border-[#6B86E1] rounded-full">
    <div class="bg-[#6B86E1] w-1/2 h-[2rem] absolute top-1/2 -translate-y-[200%]
      -translate-x-[150%]"></div>
    <div class="bg-[#6B86E1] w-full h-[2rem] absolute top-1/2 -translate-y-[150%]
      translate-x-[100%]"></div>
    <div class="bg-[#6B86E1] w-full h-[2rem] absolute top-1/2 -translate-y-1/2"></div>
    <div class="bg-[#6B86E1] w-full h-[2rem] absolute top-1/2 translate-y-1/2 
      right-0 -translate-x-[100%]"></div>
    <div class="bg-[#6B86E1] w-1/2 h-[2rem] absolute top-1/2 translate-y-[125%]
      right-0 translate-x-[150%]"></div>
  </div> 
</body>
</html>
