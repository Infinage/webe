<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <script src="datastar.js" type="module" defer></script>
</head>
<body class="bg-[#D5A06C] h-screen justify-center items-center flex">
  <div class="h-[26rem] w-[18rem] flex flex-col justify-between relative">
    <div class="flex justify-between">
      <div class="w-[5rem] aspect-square bg-[#1E2C5C] rounded-full flex 
        items-center justify-center">
      <div class="w-[2rem] aspect-square bg-[#D5A06C] rounded-full"></div>
      </div>
      <div class="w-[5rem] aspect-square bg-[#1E2C5C] rounded-full flex 
        items-center justify-center">
      <div class="w-[2rem] aspect-square bg-[#D5A06C] rounded-full"></div>
      </div>
    </div>

    <div class="rounded-full bg-[#D5A06C] h-[24rem] aspect-square absolute 
      left-1/2 top-1/2 -translate-y-1/2 -translate-x-1/2 flex items-center 
      justify-center">
      <div class="h-[22rem] aspect-square rounded-full border-[#1E2C5C] border-[2rem]"></div>
    </div>

    <div class="flex justify-between w-[90%] mx-auto">
      <div class="bg-[#1E2C5C] h-24 w-[2rem] rotate-45"></div>
      <div class="bg-[#1E2C5C] h-24 w-[2rem] -rotate-45"></div>
    </div>
  </div>
</body>
</html>
