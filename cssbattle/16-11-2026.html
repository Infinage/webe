<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
  </head>
  <body>
    <div class="outer">
      <div class="inner"></div>

      <div class="mini-triangle tr-1"></div>
      <div class="mini-triangle tr-2"></div>
      <div class="mini-triangle tr-3"></div>
      <div class="mini-triangle tr-4"></div>
      <div class="mini-triangle tr-5"></div>
      <div class="mini-triangle tr-6"></div>
      <div class="mini-triangle tr-7"></div>
      <div class="mini-triangle tr-8"></div>
    </div>

    <style>
      * {
          margin: 0;
      }

      body {
          height: 100vh;
          width: 100vw;
          background-color: #C36271;

          display: flex;
          align-items: center;
          justify-content: center;
      }

      .outer {
          height: 172px;
          aspect-ratio: 1/1;
          background-color: #F2E09F;

          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;

          &, & > div:first-child {
              clip-path: polygon(
                  30% 0, 70% 0, 100% 30%, 100% 70%, 
                  70% 100%, 30% 100%, 0 70%, 0 30%
              );
          }
      }

      .inner {
          background-color: #C36271;    
          height: 4rem;
          aspect-ratio: 1/1;
          rotate: 23deg;
      }

      .mini-triangle {
          border-top: 30px solid #C36271;
          border-right: 5px solid transparent;
          border-left: 5px solid transparent;
          border-bottom: 0px;
          position: absolute;
      }

      .tr-1 {
          top: 0%;
          left: 30%;
          rotate: -15deg;
      }

      .tr-2 {
          top: 0%;
          right: 30%;
          rotate: 15deg;
      }

      .tr-3 {
          top: 25%;
          right: 0%;
          rotate: 60deg;
      }

      .tr-4 {
          bottom: 25%;
          right: 0%;
          rotate: 120deg;
      }

      .tr-5 {
          bottom: 0%;
          right: 30%;
          rotate: 165deg;
      }

      .tr-6 {
          bottom: 0%;
          left: 30%;
          rotate: 190deg;
      }

      .tr-7 {
          bottom: 25%;
          left: 0%;
          rotate: 240deg;
      }

      .tr-8 {
          top: 25%;
          left: 0%;
          rotate: 300deg;
      }
    </style>
  </body>
</html>
