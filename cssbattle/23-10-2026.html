<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <script src="datastar.js" type="module" defer></script>
</head>
<body class="flex h-screen w-full">
  <div class="flex w-full h-full bg-[#CE4830] items-center justify-center">
    <div class="absolute rounded-full aspect-square h-1/2 bg-[#EDF4B0] 
        top-1/4 left-1/2 -translate-x-1/2 flex flex-col items-center 
        justify-end -translate-y-[10%]"
      >
        <div class="h-1/3 w-[15%] bg-[#CE4830]"></div>
        <div class="bg-[#CE4830] w-full h-1/5"></div>

        <div class="flex flex-col h-1/2 w-full p-[5%] gap-[15%] items-center absolute 
          translate-y-[60%]"
        >
          <div class="bg-[#EDF4B0] h-1/3 w-3/4"></div>
          <div class="bg-[#EDF4B0] h-1/3 w-1/2"></div>
        </div>
    </div>
  </div>
</body>
</html>
