<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <script src="alpine.js" defer></script>
</head>
<body class="grid justify-center place-items-center h-screen relative">
  <div class="bg-[#394257] h-60 w-60 relative">
    <div class="absolute bg-white w-1/2 h-1/2 -left-1/4 -top-1/4 rounded-full"></div>
    <div class="absolute bg-white w-1/2 h-1/2 -right-1/4 -top-1/4 rounded-full"></div>
    <div class="absolute bg-white w-1/2 h-1/2 -left-1/4 -bottom-1/4 rounded-full"></div>
    <div class="absolute bg-white w-1/2 h-1/2 -right-1/4 -bottom-1/4 rounded-full"></div>

    <div class="absolute bg-[#D9BB61] h-1/4 w-1/2 left-1/2 -translate-x-1/2 
      top-0 -translate-y-[125%]"></div>
    <div class="absolute bg-[#D9BB61] h-1/4 w-1/2 left-1/2 -translate-x-1/2
      bottom-0 translate-y-[125%]"></div>

    <div class="absolute bg-[#D9BB61] h-1/2 w-1/4 left-0 -translate-x-[125%]
      top-1/2 -translate-y-1/2"></div>
    <div class="absolute bg-[#D9BB61] h-1/2 w-1/4 right-0 translate-x-[125%]
      bottom-1/2 translate-y-1/2"></div>
  </div>
</body>
</html>
