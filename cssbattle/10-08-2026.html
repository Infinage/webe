<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <script src="alpine.js" defer></script>
</head>
<body class='bg-[#F3AC3C] grid justify-center place-items-center h-screen relative'>
  <div class="flex h-24 w-full gap-16">
    <div class="bg-[#144650] h-full w-48 rounded-[30px/100%]"></div>
    <div class="bg-[#144650] h-full w-48 rounded-[30px/100%]"></div>
    <div class="bg-[#144650] h-full w-48 rounded-[30px/100%]"></div>
  </div>

  <div class="absolute bg-[#144650] h-32 w-32 rounded-b-full top-0 
    left-0 translate-x-1/2 -translate-y-1/2"></div>

  <div class="absolute bg-[#144650] h-32 w-32 rounded-b-full top-0 
    right-0 -translate-x-1/2 -translate-y-1/2"></div>

  <div class="absolute bg-[#144650] h-32 w-32 rounded-t-full bottom-0
    left-0 translate-x-1/2 translate-y-1/2"></div>

  <div class="absolute bg-[#144650] h-32 w-32 rounded-t-full bottom-0 
    right-0 -translate-x-1/2 translate-y-1/2"></div>
</body>
</html>
