<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <script src="datastar.js" type="module" defer></script>
</head>
<body class="bg-[#F8B140] h-screen flex justify-center items-center">
  <div class="rounded-full w-[30rem] h-[30rem] flex flex-col overflow-hidden">
    <div class="rounded-full border-[1.5rem] border-[#465792] w-[10rem] h-[10rem] 
      self-center -translate-y-1/2"></div>

    <div class="flex h-[10rem]">
      <div class="rounded-full border-[1.5rem] border-[#465792] w-[10rem] h-[10rem] 
        self-start -translate-x-1/2"></div>

      <div class="h-[10rem] w-[10rem] flex relative justify-center">
        <div class="absolute h-full w-1/3 bg-[#465792]"></div>
        <div class="absolute h-full w-1/3 bg-[#465792] rotate-90"></div>
      </div>

      <div class="rounded-full border-[1.5rem] border-[#465792] w-[10rem] h-[10rem] 
        self-end translate-x-1/2"></div>
    </div>

    <div class="rounded-full border-[1.5rem] border-[#465792] w-[10rem] h-[10rem] 
      self-center translate-y-1/2"></div>
  </div>
</body>
</html>
