<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <script src="alpine.js" defer></script>
</head>
<body class="bg-[#7A419B] grid justify-center place-items-center h-screen">
  <div class="flex flex-col relative"
    x-data="{
      inside: false,    // expand controls
      isPlaying: false, // hover state
      progress: 0,      // 0 - 1

      togglePlay() {
        this.isPlaying? $refs.video.pause(): $refs.video.play();
      },

      toggleFullScreen() {
        document.fullscreenElement? document.exitFullscreen(): $root.requestFullscreen();
      },

      seek(val) {
         $refs.video.currentTime = Math.min(
          Math.max($refs.video.currentTime + val, 0),
          $refs.video.duration,
         );
         this.progress = $refs.video.currentTime / $refs.video.duration;
      },

      _volume: 1, // 0 - 1
      get volume() { return this._volume; },
      set volume(vol) { $refs.video.volume = vol; this._volume = vol; },

      _speed:  1, // 0 - 2
      get speed() { return this._speed; },
      set speed(sp) { $refs.video.playbackRate = sp; this._speed = sp; },
    }"

    @mouseenter="inside=true" 
    @mouseleave="inside=false"
  >
    <video 
      src="bigbuckbunny.mp4" x-ref="video" 
      @click="togglePlay" @dblclick="toggleFullScreen"
      @playing="isPlaying = true" @pause="isPlaying = false"
      @timeupdate="progress = $el.duration? ($el.currentTime / $el.duration): 0"
    ></video>
    <div class="absolute w-full bottom-0 flex flex-col">
      <div class="bg-[#FFC600]" 
        :class="[
          inside? 'h-4' : 'h-1', 
          dragging? 'cursor-ew-resize' : 'cursor-pointer'
        ]" 
        x-data="{
          dragStart: false,
          dragging: false,
          scrub(event) {
            const [t, v] = [event.target, $refs.video];
            progress = (event.offsetX - t.offsetLeft) / t.offsetWidth;
            v.currentTime = v.duration * progress;
          },
        }"
        @mousedown="dragStart = true; scrub($event);"
        @mousemove="if (dragStart) { dragging = true; scrub($event); }"
        @mouseup="dragStart = dragging = false"
        @mouseleave="dragStart = dragging = false"
        :style="`background: linear-gradient(
          to right, 
          #FFC600 ${progress * 100}%, 
          rgba(0,0,0,0.5) ${progress * 100}%
        )`"
      ></div> 
      <div x-show="inside" class="grid grid-cols-[auto_1fr_1fr_auto_auto_auto]
        text-white bg-[rgba(0,0,0,0.2)] px-4 py-1 gap-4 justify-around w-full">
        <button 
          style="font-family: serif;" type="button"
          x-text="!isPlaying? '▶': '⏸'" 
          @click.prevent="togglePlay"
        ></button>
        <input type="range" x-model="volume" max="1" min="0" step="0.05"
          class="cursor-pointer accent-[#FFC600]">
        <input type="range" x-model="speed" max="2" min="1" step="0.1"
          class="cursor-pointer accent-[#FFC600]">
        <button type="button" @click="seek(-10)">« 10s</button>
        <button type="button" @click="seek(+25)">25s »</button>
        <button type="button" class="text-xl" @click="toggleFullScreen">⛶</button>
      </div>
    </div>
  </div>
</body>
</html>
