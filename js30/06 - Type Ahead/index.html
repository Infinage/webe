<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="index.css">
    <script src="index.js" type="module" defer></script>
  </head>
  <body>
    <input id="search-input" name="search" placeholder="City or State" 
      autocomplete="off" spellcheck="off"/>

    <ul id="search-result">
      <li>Fiter For A City</li>
      <li>Or A State</li>
    </ul>

    <template id="city-template">
      <div class="city-name-state">
        <span class="city-name"></span>
        <span class="city-state"></span>
      </div>
      <span class="city-population"></span>
    </template>
  </body>
</html>
