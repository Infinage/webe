<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link href="index.css" rel="stylesheet">
    <script src="index.js" defer type="module"></script>
  </head>
  <body>
    <div class="drums">
      <div class="drum" data-key="a">
        <kbd>A</kbd>
        <span>clap</span>
        <audio src="sounds/clap.wav"></audio>
      </div>

      <div class="drum" data-key="s">
        <kbd>S</kbd>
        <span>hihat</span>
        <audio src="sounds/hihat.wav"></audio>
      </div>

      <div class="drum" data-key="d">
        <kbd>D</kbd>
        <span>kick</span>
        <audio src="sounds/kick.wav"></audio>
      </div>

      <div class="drum" data-key="f">
        <kbd>F</kbd>
        <span>openhat</span>
        <audio src="sounds/openhat.wav"></audio>
      </div>

      <div class="drum" data-key="g">
        <kbd>G</kbd>
        <span>boom</span>
        <audio src="sounds/boom.wav"></audio>
      </div>

      <div class="drum" data-key="h">
        <kbd>H</kbd>
        <span>ride</span>
        <audio src="sounds/ride.wav"></audio>
      </div>

      <div class="drum" data-key="j">
        <kbd>J</kbd>
        <span>snare</span>
        <audio src="sounds/snare.wav"></audio>
      </div>

      <div class="drum" data-key="k">
        <kbd>K</kbd>
        <span>tom</span>
        <audio src="sounds/tom.wav"></audio>
      </div>

      <div class="drum" data-key="l">
        <kbd>L</kbd>
        <span>tink</span>
        <audio src="sounds/tink.wav"></audio>
      </div>
    </div>
  </body>
</html>
