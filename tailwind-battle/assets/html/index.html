<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/css/index.css">
  <script src="/assets/js/snapdom.js"></script>
  <script src="/assets/js/datastar.js" type="module" defer></script>
  <link href="/assets/css/prism-tomorrow.min.css" rel="stylesheet" />
  <script src="/assets/js/prism.min.js"></script>

  <script>
    function containsScript(html) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      return doc.getElementsByTagName('script').length > 0;
    }

    async function captureScreenshot(iframe) {
      const doc = iframe.contentDocument;
      if (!doc?.body) return null;

      try {
        const imageResult = await snapdom(doc.body, {width: 400, height: 300, dpr: 1});
        const image = await imageResult.toPng();
        return image.src;
      } 

      catch (err) {
       console.error("Screenshot capture failed:", err);
       return null;
      }
    }
  </script>
  
  <style>
    code[class*="language-"], pre[class*="language-"] {
      background: transparent !important;
      text-shadow: none !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    .token.attr-value { color: #a78bfa !important; }
    .token.attr-name { color: #60a5fa !important; }
    .token.tag { color: #f472b6 !important; }
  </style>
</head>
<body class="bg-gray-800 text-gray-200 min-h-dvh flex flex-col"
  data-signals="{ url: '', html: '', pos: 100, shifted: false, score: 0, errorTimer: 0 }"
  data-init='
    $url = localStorage.getItem("url");
    $html = localStorage.getItem("html") || 
      "<div class=\"p-2\">" + "\n\t" +
      "<div class=\"h-25 w-25 bg-[#dd6b4d]\"></div>" + "\n" +
      "</div>"
    ;
  '
>
  <header class="flex flex-wrap bg-gray-800 py-4 px-6 gap-4 items-center 
    border-b border-b-white/10"
  >
    <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-green-400">
      Tailwind <span class="text-gray-100">Battle</span>
    </h1>
    <input data-bind="url" type="url" placeholder="Target image URL" 
      data-on:input__debounce.500ms="
        el.value && @post('/api/target', {payload: el.value});
        $preview.contentWindow.postMessage({html: $html}, '*');
        localStorage.setItem('url', $url);
      "
      class="bg-gray-500 text-gray-200 border border-white/10 focus:outline-none 
        p-2 flex-1 md:max-w-1/2 rounded-md max-w-full"
    />
    <span class="text-yellow-300 md:ml-auto text-xl">
      <span class="font-medium uppercase tracking-wider text-gray-400">Score</span>
      <span class="ml-2 font-mono font-semibold"
        data-text="$score + '%'"
        data-class="{
          'text-green-400': $score >= 80,
          'text-yellow-400': $score >= 41 && $score < 80,
          'text-orange-400': $score >= 21 && $score < 41,
          'text-red-400': $score < 21,
        }"
        >—%</span>
    </span>
  </header>

  <div class="grid flex-1 grid-cols-1 gap-4 p-4 md:grid-cols-[1fr_auto]"
  >
    <!-- Editor panel -->
    <section class="flex min-h-87.5 flex-col overflow-hidden rounded-xl border 
      border-white/10 bg-gray-900"
    >
      <div class="flex items-center justify-between border-b border-white/10 px-4 py-3">
        <h2 class="text-sm font-semibold text-gray-200">Your code</h2>
        <span class="text-xs text-gray-500">HTML + Tailwind CSS</span>
      </div>

      <div class="language-html min-h-75 w-full flex-1 resize-y overflow-auto 
        bg-gray-950 p-4 font-mono text-sm leading-6 text-gray-200 focus:outline-none"
        data-init="
          import('/assets/js/codejar.min.js').then(({CodeJar}) => {
            const jar = CodeJar(el, block => Prism.highlightElement(block));
            jar.updateCode($html);
            let timeout;
            jar.onUpdate(code => {
              $html = code;
              localStorage.setItem('html', code);
              clearTimeout(timeout);
              timeout = setTimeout(() => {
                if (containsScript(code)) return;
                $preview.contentWindow.postMessage({html: code}, '*');
              }, 500);
            });
          })
        "
      ></div>

      <div class="border-t border-white/10 px-4 py-2 text-xs text-gray-500">
        Edit your markup to match the reference.
      </div>
    </section>

    <section class="flex min-w-0 flex-col gap-4">
      <div class="overflow-hidden rounded-xl border border-white/10 bg-gray-900">
        <div class="flex items-center justify-between border-b border-white/10 px-4 py-3">
          <h2 class="text-sm font-semibold text-gray-200">Reference</h2>
          <span class="text-xs text-gray-500">Target image</span>
        </div>

        <div class="flex justify-center">
          <img alt="Reference design" src="/assets/images/default.png" 
            class="block w-100 aspect-4/3 rounded-md"
            data-ref="targetImg"
            data-attr:src="$url || '/assets/images/default.png'"
          />
        </div>
      </div>

      <!-- Live preview -->
      <div class="overflow-hidden rounded-xl border border-white/10 bg-gray-900">
        <div class="flex items-center justify-between border-b border-white/10 px-4 py-3">
          <h2 class="text-sm font-semibold text-gray-200">Live preview</h2>

          <div class="flex items-center gap-4">
            <!-- Diff toggle -->
            <label for="diffCheckBox" class="inline-flex items-center gap-2.5 
              cursor-pointer select-none rounded-full bg-gray-900 px-3 py-1.5 
              text-xs font-medium text-gray-300"
            >
              <span>Diff</span>
              <span class="relative inline-flex h-5 w-9 shrink-0 items-center rounded-full 
                bg-gray-600 transition-colors has-[:checked]:bg-green-500"
              >
                <input data-bind="diffMode" type="checkbox" id="diffCheckBox" 
                  class="peer sr-only"/>
                <span class="absolute left-0.5 h-4 w-4 rounded-full bg-white
                   shadow-sm transition-transform peer-checked:translate-x-4"
                 ></span>
              </span>
            </label>

            <!-- Live indicator -->
            <span class="flex items-center gap-2 text-xs text-green-400 select-none">
              <span class="h-2 w-2 rounded-full bg-green-400 animate-pulse"></span>
              Live
            </span>
          </div>
        </div>

        <!-- Comparison viewport -->
        <div class="relative aspect-4/3 max-w-100 overflow-hidden rounded-md 
          border border-white/10 mx-auto"
          data-on:keydown__window="if (evt.key === 'Shift') $shifted = true;"
          data-on:keyup__window="if (evt.key === 'Shift') $shifted = false;"
        >
          <!-- Target image -->
          <img class="absolute inset-0 h-full w-full object-cover" 
            alt="Target" data-class="{'opacity-75': $diffMode}"
            data-attr:src="$url || '/assets/images/default.png'" />

          <!-- Source image -->
          <img class="absolute inset-0 h-full w-full object-cover"
            data-attr:src="$sourceImgString" alt="Your preview" 
            data-class="{
              'mix-blend-difference': $diffMode, 
              'opacity-85': !$diffMode && $_sliderMouseIn,
            }"
            data-style="{
              'clip-path': $diffMode
                ? 'none'
                : $shifted 
                  ? 'inset(0 0 ' + (100 - $pos) + '% 0)' 
                  : 'inset(0 ' + (100 - $pos) + '% 0 0)'
            }"
          />

          <!-- Slider divider -->
          <div 
            data-show="$_sliderMouseIn && !$diffMode" 
            data-style="$shifted ? 
              {'top': $pos + '%', 'left': '0'} : 
              {'left': $pos + '%', 'top': '0'}
            "
            class="pointer-events-none absolute z-10 bg-white 
              shadow-[0_0_5px_rgba(0,0,0,0.8)]"
            data-class="{
              'bottom-0 w-0.5 -translate-x-1/2': !$shifted,
              'right-0 h-0.5 -translate-y-1/2': $shifted
            }"
          >
            <div class="absolute left-1/2 top-1/2 flex h-8 w-8 -translate-x-1/2 
              -translate-y-1/2 items-center justify-center rounded-full bg-white 
              shadow-md"
            >
              <svg class="h-5 w-5 text-gray-600" fill="none" stroke="currentColor"
                viewBox="0 0 24 24" >
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M8 9l-4 4 4 4m8-8l4 4-4 4"></path>
              </svg>
            </div>
            <span class="absolute p-1 opacity-85 bg-red-400 text-white" 
              data-class="{
                'bottom-0': !$shifted, 'right-0': $shifted,
                '-translate-x-full': !$shifted && $pos > 90,
                '-translate-y-full':  $shifted && $pos > 90,
              }"
              data-text="Math.round($pos * ($shifted? 3: 4))"></span>
          </div>

          <!-- Slider interaction -->
          <input data-show="!$diffMode" type="range" min="0" max="100" 
            step="0.1" data-bind="pos" aria-label="Compare target and preview" 
            class="absolute inset-0 z-20 m-0 h-full w-full cursor-ew-resize opacity-0"
            data-class="{'cursor-ew-resize': !$shifted, 'cursor-ns-resize': $shifted}"
            data-on:mouseleave="$pos = 100; $_sliderMouseIn = false;"
            data-on:mousemove="
              $_sliderMouseIn = true;
              const rect = el.getBoundingClientRect();
              const magX = (event.clientX - rect.left) / rect.width;
              const magY = (event.clientY - rect.top) / rect.height;
              const mag = $shifted? magY: magX;
              $pos = Math.max(0, Math.min(100, mag * 100));
            "
          />

          <!-- Hidden rendering iframe -->
          <iframe src="/assets/html/sandbox.html"
            sandbox="allow-scripts allow-same-origin" data-ref:preview
            class="absolute right-full aspect-4/3 max-w-100 overflow-hidden"
            data-attr="{ height: $targetImg.height, width: $targetImg.width, }"
            data-on:load="el.contentWindow.postMessage({html: $html}, '*')"
            data-on:message__window="
              if (event.origin !== window.location.origin) return;
              if (event.data?.type !== 'preview-updated') return;
              captureScreenshot(el).then(image => {
                if (!image) return;
                $sourceImgString=image;
                @post('/api/diff', {
                  payload: { 
                    source: $sourceImgString, 
                    targetURL: $url,
                  }
                });
              });
            "
          ></iframe>
        </div>
      </div>
    </section>
  </div>

  <!-- Error toast -->
  <div 
    data-show="$showError" 
    data-on-signal-patch-filter="{include: '/^showError$/'}"
    data-on-signal-patch="$showError? 
      (clearTimeout($errorTimer), $errorTimer = setTimeout(() => $showError = false, 3000))
      : clearTimeout($errorTimer)"
    class="fixed bottom-4 left-1/2 z-50 w-[calc(100%-2rem)] max-w-sm -translate-x-1/2 
       md:bottom-6 md:right-6 md:left-auto md:translate-x-0"
  >
    <div role="alert" class="overflow-hidden rounded-xl border border-red-400/20 
      bg-gray-900 shadow-2xl ring-1 ring-black/5"
    >
      <div class="p-4">
        <div class="flex items-start gap-3">
          <!-- Icon -->
          <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full 
            bg-red-500/15 text-red-400"
          >
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M12 9v4m0 4h.01M10.3 3.9 1.8 18.6A2 2 0 0 0 3.5 21h17a2 2 0 0 0 1.7-2.4L13.7 
                  3.9a2 2 0 0 0-3.4 0Z"/>
            </svg>
          </div>

          <!-- Content -->
          <div class="min-w-0 flex-1 pt-1">
            <h2 id="errorTitle" class="font-medium text-sm text-gray-100">
              Something went wrong
            </h2>
            <p data-text="$errorMessage" class="mt-1 break-words text-sm text-gray-400"></p>
          </div>

          <!-- Close Button -->
          <div class="ml-4 flex shrink-0">
            <button type="button" aria-label="Close error dialog" 
              data-on:click="$showError = false" class="inline-flex rounded-md 
                text-gray-500 transition hover:text-white cursor-pointer"
            >
              <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M6 18 18 6M6 6l12 12"/>
              </svg>
            </button>
          </div>
          
        </div>
      </div>
    </div>
  </div>
</body>
</html>
