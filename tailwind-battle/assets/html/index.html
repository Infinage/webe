<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/css/index.css">
  <script src="/assets/js/snapdom.js"></script>
  <script src="/assets/js/datastar.js" type="module" defer></script>
  <link href="/assets/css/prism-tomorrow.min.css" rel="stylesheet" />
  <script src="/assets/js/prism.min.js"></script>

  <script>
    function containsScript(html) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      return doc.getElementsByTagName('script').length > 0;
    }

    async function captureScreenshot(iframe, targetImg) {
      const doc = iframe.contentDocument;
      if (!doc?.body || !targetImg.complete || !targetImg.naturalWidth) {
        return null;
      }

      try {
        const imageResult = await snapdom(doc.body);
        const image = await imageResult.toPng();
        return image.src;
      } 

      catch (err) {
       console.error("Screenshot capture failed:", err);
       return null;
      }
    }
  </script>
  
  <style>
    code[class*="language-"], pre[class*="language-"] {
      background: transparent !important;
      text-shadow: none !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    .token.attr-value { color: #a78bfa !important; }
    .token.attr-name { color: #60a5fa !important; }
    .token.tag { color: #f472b6 !important; }
  </style>
</head>
<body class="bg-gray-800 text-gray-200 min-h-dvh flex flex-col">
  <header class="flex flex-wrap bg-gray-800 py-4 px-6 gap-4 items-center 
    border-b border-b-white/10"
  >
    <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-green-400">
      Tailwind <span class="text-gray-100">Battle</span>
    </h1>
    <input data-bind="url" type="url" placeholder="Target image URL" 
      data-on:input__debounce.250ms="
        if (el.value) {
          @post('/api/target', {payload: el.value});
          $preview.contentWindow.postMessage({html: $html}, '*');
        }
        else {
          $targetImgString='';
        }
      "
      class="bg-gray-500 text-gray-200 border border-white/10 focus:outline-none 
        p-2 flex-1 md:max-w-1/2 rounded-md max-w-full"
    />
    <span class="text-yellow-300 md:ml-auto text-xl">
      <span class="font-medium uppercase tracking-wider text-gray-400">Score</span>
      <span data-signals:score="0" data-text="$score + '%'"
        class="ml-2 font-mono font-semibold text-green-400"
        >—%</span>
    </span>
  </header>

  <div class="grid flex-1 grid-cols-1 gap-4 p-4 md:grid-cols-[1fr_auto]"
    data-signals:html='
      "<div class=\"p-2\">" + "\n\t" +
      "<div class=\"h-25 w-25 bg-[#dd6b4d]\"></div>" + "\n" +
      "</div>"
    '
  >
    <!-- Editor panel -->
    <section class="flex min-h-87.5 flex-col overflow-hidden rounded-xl border 
      border-white/10 bg-gray-900"
    >
      <div class="flex items-center justify-between border-b border-white/10 px-4 py-3">
        <h2 class="text-sm font-semibold text-gray-200">Your code</h2>
        <span class="text-xs text-gray-500">HTML + Tailwind CSS</span>
      </div>

      <div class="language-html min-h-75 w-full flex-1 resize-y overflow-auto 
        bg-gray-950 p-4 font-mono text-sm leading-6 text-gray-200 focus:outline-none"
        data-init="
          import('/assets/js/codejar.min.js').then(({CodeJar}) => {
            const jar = CodeJar(el, block => Prism.highlightElement(block));
            jar.updateCode($html);
            let timeout;
            jar.onUpdate(code => {
              $html = code;
              clearTimeout(timeout);
              timeout = setTimeout(() => {
                if (containsScript(code)) return;
                $preview.contentWindow.postMessage({html: code}, '*');
              }, 500);
            });
          })
        "
      ></div>

      <div class="border-t border-white/10 px-4 py-2 text-xs text-gray-500">
        Edit your markup to match the reference.
      </div>
    </section>

    <section class="flex min-w-0 flex-col gap-4">
      <div class="overflow-hidden rounded-xl border border-white/10 bg-gray-900">
        <div class="flex items-center justify-between border-b border-white/10 px-4 py-3">
          <h2 class="text-sm font-semibold text-gray-200">Reference</h2>
          <span class="text-xs text-gray-500">Target image</span>
        </div>

        <div class="flex justify-center">
          <img alt="Reference design" data-ref="targetImg"
            data-signals:targetImgString="''"
            data-attr:src="$url || '/assets/images/default.png'"
            src="/assets/images/default.png" class="block w-100 aspect-4/3 
              rounded-md"
          />
        </div>
      </div>

      <!-- Live preview -->
      <div class="overflow-hidden rounded-xl border border-white/10 bg-gray-900">
        <div class="flex items-center justify-between border-b border-white/10 px-4 py-3">
          <h2 class="text-sm font-semibold text-gray-200">Live preview</h2>

          <div class="flex items-center gap-4">
            <!-- Diff toggle -->
            <label for="diffCheckBox" class="inline-flex items-center gap-2.5 
              cursor-pointer select-none rounded-full bg-gray-900 px-3 py-1.5 
              text-xs font-medium text-gray-300"
            >
              <span>Diff</span>
              <span class="relative inline-flex h-5 w-9 shrink-0 items-center rounded-full 
                bg-gray-600 transition-colors has-[:checked]:bg-gray-500"
              >
                <input data-bind="diffMode" type="checkbox" id="diffCheckBox" 
                  class="peer sr-only"/>
                <span class="absolute left-0.5 h-4 w-4 rounded-full bg-white
                   shadow-sm transition-transform peer-checked:translate-x-4"
                 ></span>
              </span>
            </label>

            <!-- Live indicator -->
            <span class="flex items-center gap-2 text-xs text-green-400 select-none">
              <span class="h-2 w-2 rounded-full bg-green-400 animate-pulse"></span>
              Live
            </span>
          </div>
        </div>

        <!-- Comparison viewport -->
        <div class="relative aspect-4/3 max-w-100 overflow-hidden rounded-md border 
          border-white/10 mx-auto" data-signals:pos="100"
        >
          <!-- Target image -->
          <img class="absolute inset-0 h-full w-full object-cover" 
            alt="Target" data-class="{'opacity-75': $diffMode}"
            data-attr:src="$url || '/assets/images/default.png'" />

          <!-- Source image -->
          <img class="absolute inset-0 h-full w-full object-cover"
            data-class="{'mix-blend-difference': $diffMode}"
            data-attr:src="$sourceImgString" alt="Your preview" 
            data-style="{'clip-path': 'inset(0 ' + (100 - $pos) + '% 0 0)'}"
          />

          <!-- Slider divider -->
          <div data-style="{'left': $pos + '%'}" class="pointer-events-none 
            absolute bottom-0 top-0 z-10 w-0.5 -translate-x-1/2 bg-white 
            shadow-[0_0_5px_rgba(0,0,0,0.8)]"
          >
            <div class="absolute left-1/2 top-1/2 flex h-8 w-8 -translate-x-1/2 
              -translate-y-1/2 items-center justify-center rounded-full bg-white 
              shadow-md"
            >
              <svg class="h-5 w-5 text-gray-600" fill="none" stroke="currentColor"
                viewBox="0 0 24 24" >
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M8 9l-4 4 4 4m8-8l4 4-4 4"></path>
              </svg>
            </div>
          </div>

          <!-- Slider interaction -->
          <input type="range" min="0" max="100" step="0.1" data-bind="pos"
            aria-label="Compare target and preview" class="absolute inset-0 z-20 
              m-0 h-full w-full cursor-ew-resize opacity-0"
          />

          <!-- Hidden rendering iframe -->
          <iframe src="/assets/html/sandbox.html"
            sandbox="allow-scripts allow-same-origin"
            class="absolute right-full aspect-4/3 max-w-100 overflow-hidden"
            data-ref:preview
            data-on:load="el.contentWindow.postMessage({html: $html}, '*')"
            data-on:message__window="
              if (event.origin !== window.location.origin) return;
              if (event.data?.type !== 'preview-updated') return;
              captureScreenshot(el, $targetImg).then(image => {
                if (!image) return;
                $sourceImgString=image;
                @post('/api/diff', {
                  payload: { source: $sourceImgString, targetString: $targetImgString }
                });
              });
            "
            data-attr="{
              height: $targetImg.naturalHeight,
              width: $targetImg.naturalWidth
            }"
          ></iframe>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
