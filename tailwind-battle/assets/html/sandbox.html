<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <script src="/assets/js/datastar.js" type="module" defer></script>
</head>
<body class="bg-white h-screen">
  <div 
    data-on:message__window="
      // Read inbound change and render
      if (event.origin != window.location.origin) return;
      el.innerHTML = event.data.html;

      // Signal completion
      new Promise(requestAnimationFrame).then(() => {
        window.parent.postMessage({ type: 'preview-updated' }, window.location.origin);
      });
    "
  ></div>
</body>
</html>
