<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/index.css">
  <script src="/assets/datastar.js" type="module" defer></script>
  <script>
    function containsScript(html) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      return doc.getElementsByTagName('script').length > 0;
    }
  </script>
</head>
<body class="bg-gray-800 text-gray-200 min-h-dvh flex flex-col">
  <div class="flex flex-wrap bg-gray-700 p-4 gap-4 items-center">
    <h1 class="text-2xl md:text-4xl uppercase text-center text-green-300">
      Tailwind Battle
    </h1>
    <input data-bind="url" type="url" placeholder="Target image URL" 
      class="bg-gray-500 text-gray-200 focus:outline-none p-2 flex-1 
        md:max-w-1/2 rounded-md max-w-full"
    />
    <span class="text-yellow-300 text-2xl md:text-3xl md:ml-auto">Score: %</span>
  </div>
  <div class="flex flex-1 w-full flex-col-reverse md:flex-row"
    data-signals:html='
      "<div class=\"p-2\">" + "\n\t" +
      "<div class=\"h-25 w-25 bg-[#dd6b4d]\"></div>" + "\n" +
      "</div>"
    '
  >

    <!-- User's Code Editor -->
    <textarea spellcheck="false" data-bind:html
      class="flex flex-1 border border-gray-200/50 p-2 md:min-h-full m-2
        min-h-[50dvh] bg-gray-900 rounded-md focus:outline-none" 
      data-on:keyup__debounce.500ms="
        if (containsScript($html)) return;
        $preview.contentWindow.postMessage({html: $html}, '*');
      "
    ></textarea>

    <div class="flex flex-col justify-center items-center p-4">
      <!-- Display target -->
      <img src='/assets/test.png' height="300px" width="400px"/>

      <hr class="border border-gray-200/25 my-4 w-100"/>

      <!-- Display Preview -->
      <iframe data-ref:preview
        data-on:load="el.contentWindow.postMessage({html: $html}, '*')"
        src="/assets/sandbox.html"
        sandbox="allow-scripts allow-same-origin" 
        class="w-full max-w-100 aspect-4/3"
      ></iframe>
    </div>
  </div>
</body>
</html>
