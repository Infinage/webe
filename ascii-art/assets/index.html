<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Art</title>
    <script src="assets/datastar.js" type="module" defer></script>
    <link rel="stylesheet" href="assets/index.css">
</head>
<body 
  data-signals="{ 
    _output: 'Paste a URL to asciify', _timeout: null, 
    _size: '16px', _inputType: 'url', _filename: '',
  }"
  class="bg-gray-900 flex justify-center h-screen text-gray-200"
>
  <div class="flex flex-col w-full max-w-200 h-96 m-10 gap-8 items-center">
    <h1 class="text-3xl text-center font-mono">
      ASCII Art Generator
    </h1>

    <form data-indicator:_loading enctype="multipart/form-data"
      class="bg-gray-800 flex flex-col gap-5 p-8 w-full rounded-md"
      data-on:submit="@post('/api/asciify', {contentType: 'form'})"
    >
      <div data-show="$_inputType === 'url'" class="flex flex-col col-span-2 gap-2">
        <label class="uppercase text-sm flex gap-2">
          <span>Image URL</span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" 
            xml:space="preserve" class="h-5 w-5 cursor-pointer" title="Switch input mode" 
            data-on:click="$_inputType = 'upload'; $_inputURL.value = ''"
          >
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-miterlimit="10" 
              d="M21.5 9 20 7h-8l-1.5 2H4v16h24V9z"/>
            <circle fill="none" stroke="currentColor" stroke-width="2" stroke-miterlimit="10" 
              cx="16" cy="17" r="5"/>
            <circle cx="8" cy="12" r="1"/>
          </svg>
        </label>
        <input type="url" name="url" placeholder="https://..." data-ref="_inputURL"
          class="flex-1 py-1 px-2 rounded-md border border-gray-50/25" 
        />
      </div>

      <div data-show="$_inputType === 'upload'" class="flex flex-col gap-2">
        <label class="uppercase text-sm flex gap-2">
          <span>Upload Image</span>
          <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 cursor-pointer"
            title="Switch input mode" xmlns="http://www.w3.org/2000/svg" 
            data-on:click="$_inputType = 'url'; $_inputImage.value = ''; $_filename = ''"
          >
            <path d="M8 8c-2.248 0-4 1.752-4 4s1.752 4 4 4h2a1 1 0 1 1 0 2H8c-3.352 
              0-6-2.648-6-6s2.648-6 6-6h2a1 1 0 1 1 0 2zm5-1a1 1 0 0 1 1-1h2c3.352 
              0 6 2.648 6 6s-2.648 6-6 6h-2a1 1 0 1 1 0-2h2c2.248 0 4-1.752 
              4-4s-1.752-4-4-4h-2a1 1 0 0 1-1-1m-6 5a1 1 0 0 1 1-1h8a1 1 0 1 1 0 
              2H8a1 1 0 0 1-1-1" fill="currentColor"/>
          </svg>
        </label>

        <label class="flex flex-col items-center justify-center h-24 rounded-md 
          border border-dashed border-gray-50/25 hover:border-gray-50/50 
          cursor-pointer bg-gray-900/30"
        >
          <input type="file" name="image" 
            class="hidden" data-ref="_inputImage"
            accept="image/png, image/jpeg, image/webp"
            data-on:change="$_filename=el.files[0].name"
          />
          <span class="text-sm"
            data-text="$_filename || 'Choose an image'"
          >Choose an image</span>
          <span class="text-xs text-gray-400 mt-1"
            data-text="$_filename? 'Click to change': 'PNG, JPEG or WebP'"
          >PNG, JPEG or WebP</span>
        </label>
      </div>

      <div class="flex flex-col gap-2">
        <label class="uppercase text-sm">Downscale Factor</label>
        <input required inputmode="numeric" pattern="[0-9]*" 
          value="1" name="downscale" placeholder="4" 
          class="flex-1 py-1 px-2 rounded-md border border-gray-50/25" 
        />
      </div>

      <button data-attr:disabled="$_loading"
        data-text="$_loading ? 'Processing...' : 'Asciify'"
        class="uppercase bg-blue-600 hover:bg-blue-700 font-medium col-span-2 
          rounded-md py-1 cursor-pointer disabled:cursor-not-allowed 
          disabled:bg-blue-600/50"
      >Asciify</button>
    </form>

    <fieldset 
      class="bg-gray-800 w-full rounded-md p-4 border border-gray-50/25 
        cursor-copy"
      data-on:click="
        navigator.clipboard.writeText($_output);
        $_clicked = true;
        clearTimeout($_timeout);
        $_timeout = setTimeout(() => $_clicked = false, 500);
      "
    >
      <legend class="uppercase text-md font-mono">
        Output 
        <span 
          class="text-xs text-green-400" 
          data-show="$_clicked"
        >Copied!</span>
      </legend>
      <pre 
        data-text="$_output" 
        data-style:font-size="$_size"
        class="px-4 font-mono select-none w-full"
      ></pre>
    </fieldset>
</body>
</html>
